<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Portal Selado</title>
  <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon-32x32.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- fagulhas subindo no fundo, só decoração -->
  <span class="brasa" style="--x:6%;  --d:0s;   --t:9s"></span>
  <span class="brasa" style="--x:18%; --d:2.4s; --t:11s"></span>
  <span class="brasa" style="--x:28%; --d:1s;   --t:8s"></span>
  <span class="brasa" style="--x:40%; --d:4s;   --t:10s"></span>
  <span class="brasa" style="--x:55%; --d:0.6s; --t:12s"></span>
  <span class="brasa" style="--x:64%; --d:3s;   --t:9.5s"></span>
  <span class="brasa" style="--x:74%; --d:1.8s; --t:11.5s"></span>
  <span class="brasa" style="--x:84%; --d:3.6s; --t:8.5s"></span>
  <span class="brasa" style="--x:92%; --d:0.2s; --t:10.5s"></span>
  <span class="brasa" style="--x:12%; --d:5s;   --t:9s"></span>
  <span class="brasa" style="--x:48%; --d:2s;   --t:13s"></span>
  <span class="brasa" style="--x:70%; --d:4.5s; --t:9s"></span>

  <main class="portal">

    <!-- cadeado em forma de coração: começa fechado, abre quando a senha está certa -->
    <div class="cadeado" id="cadeado" aria-hidden="true">
      <svg viewBox="0 0 100 128" class="cadeado-svg">
        <!-- o corpo, em forma de coração (desenhado primeiro, fica por baixo) -->
        <path class="cadeado-corpo"
          d="M50,110.7 L43.6,104.9 C21,84.4 6,70.8 6,54.2 C6,40.6 16.6,30 30.2,30 C37.9,30 45.2,33.6 50,39.2 C54.8,33.6 62.1,30 69.8,30 C83.4,30 94,40.6 94,54.2 C94,70.8 79,84.4 56.4,105 L50,110.7 Z"></path>
        <!-- a alça: desenhada depois, fica por cima do coração -->
        <path id="alca" class="cadeado-alca"
          d="M35,38 L35,30 C35,12 41,4 50,4 C59,4 65,12 65,30 L65,38"></path>
        <!-- a fechadura -->
        <circle class="cadeado-fechadura" cx="50" cy="64" r="8"></circle>
        <path class="cadeado-fechadura" d="M45,71 L55,71 L58,90 L42,90 Z"></path>
      </svg>
    </div>

    <h1 class="titulo">O Portal Está Selado</h1>
    <p class="subtitulo">Apenas quem conhece a palavra sagrada pode atravessar.</p>

    <form id="form-senha" class="form-senha" autocomplete="off">
      <label for="campo-senha" class="rotulo">Palavra Sagrada</label>
      <input
        type="password"
        id="campo-senha"
        class="campo"
        placeholder="••••••••"
        required
      >
      <button type="submit" class="botao">Abrir o Portal</button>
    </form>

    <p id="mensagem-erro" class="erro" role="alert"></p>

  </main>

  <script src="script.js"></script>
</body>
</html>
