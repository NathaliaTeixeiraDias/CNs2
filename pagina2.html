<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Portal Aberto</title>
  <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap">
  <link rel="stylesheet" href="pagina2.css">
</head>
<body>

  <canvas id="c"></canvas>

  <header>
    <h1 class="titulo">Bem-vindo(a) ao outro lado do portal</h1>
  </header>

  <button id="btn">Pressione aqui</button>

  <main>
    <!-- some até o coração terminar de se formar -->
    <nav id="nav-mensagens" hidden>
      <p class="rotulo">Escolha um caminho:</p>
      <ul>
        <li><a href="mensagem1.html">Primeira mensagem</a></li>
        <li><a href="mensagem2.html">Segunda mensagem</a></li>
      </ul>
    </nav>
  </main>

  <!-- frases de "eu te amo" em vários idiomas, flutuando pela tela -->
  <div id="frases-amor" hidden>
    <span class="frase-amor" style="--x:12%; --y:20%; --atraso:0s">I love you</span>
    <span class="frase-amor" style="--x:80%; --y:16%; --atraso:.5s">Je t'aime</span>
    <span class="frase-amor" style="--x:8%;  --y:58%; --atraso:1s">Ich liebe dich</span>
    <span class="frase-amor" style="--x:84%; --y:56%; --atraso:.3s">Ti amo</span>
    <span class="frase-amor" style="--x:18%; --y:78%; --atraso:1.4s">愛してる</span>
    <span class="frase-amor" style="--x:76%; --y:80%; --atraso:.8s">Te quiero</span>
  </div>

  <script src="pagina2.js"></script>
</body>
</html>
