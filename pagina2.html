<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>O Portal Aberto</title>
  <link rel="icon" type="image/png" sizes="32x32" href="imagens/favicon-32x32.png">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=EB+Garamond:ital@0;1&display=swap">
  <link rel="stylesheet" href="pagina2.css">
</head>
<body>

  <canvas id="c"></canvas>

  <header>
    <h1 class="titulo">Bem-vindo(a) ao outro lado do portal</h1>
  </header>

  <button id="btn">Clique aqui</button>

  <main>
    <!-- some até o coração terminar de se formar -->
    <nav id="nav-mensagens" hidden>
      <p class="rotulo">Escolha um caminho:</p>
      <ul>
        <li><a href="mensagem1.html">Primeira mensagem</a></li>
        <li><a href="mensagem2.html">Segunda mensagem</a></li>
      </ul>
    </nav>
  </main>

  <!-- bolhas flutuantes: cada uma abre uma foto ao ser clicada -->
  <div id="bolhas" hidden>
    <button class="bolha" style="--x:14%; --y:22%; --atraso:0s"   data-foto="imagens/foto1.jpg">💗</button>
    <button class="bolha" style="--x:82%; --y:18%; --atraso:.6s"  data-foto="imagens/foto2.jpg">💗</button>
    <button class="bolha" style="--x:10%; --y:60%; --atraso:1.1s" data-foto="imagens/foto3.jpg">💗</button>
    <button class="bolha" style="--x:86%; --y:58%; --atraso:.3s"  data-foto="imagens/foto4.jpg">💗</button>
  </div>

  <!-- a janela que mostra a foto grande -->
  <div id="modal-foto" class="modal" hidden>
    <img src="">
    <button id="fechar-modal" aria-label="Fechar">×</button>
  </div>

  <script src="pagina2.js"></script>
</body>
</html>
